name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt（语法/格式检查）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.77.2
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  build:
    name: Windows x64 构建（MSVC）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 工具链版本由 rust-toolchain.toml 锁定为 1.77.2（Win7 兼容上限）
      - uses: dtolnay/rust-toolchain@1.77.2

      # ring 的 Windows 汇编需求；若命中预生成汇编则此步冗余但无害
      - name: Install NASM
        run: |
          choco install nasm -y --no-progress
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Build (release, locked)
        run: cargo build --release --locked

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BingWallpaper-Rust-x64
          path: target/release/bing-wallpaper-rust.exe
          if-no-files-found: error
