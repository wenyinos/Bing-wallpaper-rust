name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt（语法/格式检查）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.77.2
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  build:
    name: Windows ${{ matrix.arch }} 构建（MSVC）
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: i686-pc-windows-msvc
            arch: x86
    steps:
      - uses: actions/checkout@v4

      # 工具链版本由 rust-toolchain.toml 锁定为 1.77.2（Win7 兼容上限）
      - uses: dtolnay/rust-toolchain@1.77.2
        with:
          targets: ${{ matrix.target }}

      # ring 的 Windows 汇编需求；若命中预生成汇编则此步冗余但无害
      - name: Install NASM
        run: |
          choco install nasm -y --no-progress
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Build (release, locked)
        run: cargo build --release --locked --target ${{ matrix.target }}

      # 两个架构产物同名，重命名后才能共存于同一 Release
      - name: Rename binary
        run: Copy-Item "target/${{ matrix.target }}/release/bing-wallpaper-rust.exe" "BingWallpaper-Rust-${{ matrix.arch }}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BingWallpaper-Rust-${{ matrix.arch }}
          path: BingWallpaper-Rust-${{ matrix.arch }}.exe
          if-no-files-found: error

      # 打 v* tag 时：构建产物直接附加到同名 Release（不存在则自动创建）
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: BingWallpaper-Rust-${{ matrix.arch }}.exe
          generate_release_notes: true
